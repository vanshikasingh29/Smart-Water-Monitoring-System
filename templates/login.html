<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Water Monitoring Login</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Roboto',sans-serif;
height:100vh;
margin:0;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

/* SLOWER + SMOOTHER gradient */
background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #f5d7ec, #a7c3f2);
background-size: 400% 400%;
animation: gradientMove 30s ease-in-out infinite;
}

/* smoother animation */
@keyframes gradientMove {
0% {background-position: 0% 50%;}
50% {background-position: 100% 50%;}
100% {background-position: 0% 50%;}
}

/* Wrapper for glow border */
.glow-wrapper{
padding:2px;
border-radius:22px;
background: linear-gradient(135deg, #4a90e2, #fbc2eb, #4a90e2);
background-size: 200% 200%;
animation: borderGlow 6s ease infinite;
}

/* subtle moving glow */
@keyframes borderGlow {
0% {background-position: 0% 50%;}
50% {background-position: 100% 50%;}
100% {background-position: 0% 50%;}
}

/* Glass card */
.login-container{
background:rgba(255,255,255,0.9);
backdrop-filter:blur(12px);
padding:40px 50px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.12);
width:360px;
text-align:center;
}

/* Title */
h1{
color:#1e3c72;
margin-bottom:25px;
font-weight:700;
letter-spacing:1px;
}

/* Inputs */
input[type="text"],
input[type="password"]{
width:90%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
transition:0.3s;
background:#f9f9f9;
}

input:focus{
outline:none;
border-color:#4a90e2;
box-shadow:0 0 6px rgba(74,144,226,0.4);
background:white;
}

/* Login button */
input[type="submit"]{
background:linear-gradient(135deg,#1e3c72,#4a90e2);
color:white;
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
transition:0.3s;
width:95%;
margin-top:10px;
}

input[type="submit"]:hover{
background:linear-gradient(135deg,#4a90e2,#f78fb3);
transform:translateY(-2px);
}

/* Text */
p{
font-size:14px;
color:#555;
margin:8px 0;
}

/* Error */
.error{
color:#e63946;
font-size:12px;
margin-top:10px;
}

/* Register button */
.register-btn{
margin-top:10px;
background:linear-gradient(135deg,#fbc2eb,#a6c1ee);
color:#1e3c72;
padding:10px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.register-btn:hover{
background:linear-gradient(135deg,#f78fb3,#4a90e2);
color:white;
transform:translateY(-2px);
}

/* Floating circles (unchanged but subtle) */
.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,0.15);
animation: float 12s infinite ease-in-out;
}

.circle:nth-child(1){
width:120px;
height:120px;
top:10%;
left:15%;
}

.circle:nth-child(2){
width:80px;
height:80px;
bottom:15%;
right:20%;
animation-delay:3s;
}

.circle:nth-child(3){
width:60px;
height:60px;
top:70%;
left:10%;
animation-delay:6s;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-25px);}
}

</style>

</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<!-- NEW glow wrapper -->
<div class="glow-wrapper">
    <div class="login-container">

        <h1>Water Monitoring</h1>

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <input type="submit" value="Login">
        </form>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <p>Enter your credentials to access the dashboard</p>

        <p>Don't have an account?</p>

        <a href="{{ url_for('register') }}">
            <button class="register-btn">Create Account</button>
        </a>

    </div>
</div>

</body>
</html>
