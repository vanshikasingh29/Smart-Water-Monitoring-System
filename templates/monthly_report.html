<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Water Quality Report</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 30px;
    background: #f5f7fa;
}

h1 {
    text-align: center;
    color: #0288d1;
}

.subtitle {
    text-align: center;
    margin-bottom: 30px;
    color: #555;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

th {
    background: #0288d1;
    color: white;
}

tr:nth-child(even) {
    background: #f2f2f2;
}

.safe {
    color: green;
    font-weight: bold;
}

.danger {
    color: red;
    font-weight: bold;
}

.footer {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: #888;
}
</style>

</head>

<body>

<h1>AquaGuard Water Report</h1>
<p class="subtitle">Generated automatically from the system data</p>

<table>
<tr>
    <th>Time</th>
    <th>pH</th>
    <th>Turbidity</th>
    <th>Temperature (°C)</th>
    <th>Risk</th>
</tr>

{% for item in history %}
<tr>
    <td>{{ item.time }}</td>
    <td>{{ item.ph }}</td>
    <td>{{ item.turbidity }}</td>
    <td>{{ item.temperature }}</td>
    <td class="{{ 'safe' if item.risk == 'SAFE' else 'danger' }}">
        {{ item.risk }}
    </td>
</tr>
{% endfor %}

</table>

<div class="footer">
    AquaGuard Monitoring System • Report Generated Automatically
</div>

</body>
</html>
